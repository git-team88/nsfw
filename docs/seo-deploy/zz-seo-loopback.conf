# ============================================================
# SEO 渲染回环（仅供本机 puppeteer 绕 Cloudflare 使用）
# 作用：渲染服务通过 SEO_RESOLVER_RULES 把站点域名解析到 127.0.0.1，
#       本块在 127.0.0.1:443 提供该域名的 HTTPS 服务（自签证书），
#       内部把请求转交给 127.0.0.1:80 的同一 vhost。
# 环境：三个站（bl / social / nsfw）× 正式 / 测试 共用这一份，不写死域名 ——
#       下面列出全部域名（www / 裸域 / 测试域 / API 域），Host 用 $host 原样透传，
#       实际渲染哪个站由各站 pm2 配置里的 SPA_URL / SEO_RESOLVER_RULES 决定。
#       服务器上只放一份（/usr/local/nginx/conf/vhost/），三个项目仓库里的副本内容相同。
# 安全：只监听 127.0.0.1，外网访问不到；不影响 0.0.0.0:443 的既有站点。
# ============================================================
server {
    listen 127.0.0.1:443 ssl;
    server_name www.blfans.ai blfans.ai wwwtest.blfans.ai www.moegen.ai moegen.ai testapp.addaiaroot.com www.fansfans.ai fansfans.ai wwwtest.fansfans.ai api.moegen.ai api2.moegen.ai;

    ssl_certificate     cert/seo-loopback.pem;
    ssl_certificate_key cert/seo-loopback.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 内部转到本机 80 端口的同名站点（Host 跟随渲染服务实际请求的域名）
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP 127.0.0.1;
        proxy_set_header X-Forwarded-For 127.0.0.1;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:80;
    }
}
