# ============================================
# Nginx SEO 配置 - 按需渲染方案
# 将此配置添加到现有 www.moegen.ai 的 server 块中
# ============================================

# 爬虫 User-Agent 判断
map $http_user_agent $is_bot {
    default 0;
    ~*googlebot 1;
    ~*bingbot 1;
    ~*baiduspider 1;
    ~*yandexbot 1;
    ~*duckduckbot 1;
    ~*slurp 1;
    ~*facebot 1;
    ~*ia_archiver 1;
    ~*mediapartners 1;
    ~*adsbot-google 1;
    ~*ahrefsbot 1;
    ~*semrushbot 1;
    ~*chatgpt-user 1;
}

# 需要SEO渲染的路径（详情页等动态内容页）
# 首页和分类页已有预渲染静态HTML，不需要走SEO服务
map $uri $need_seo_render {
    default 0;
    ~*^/detail 1;
    ~*^/novel-detail 1;
    ~*^/novel/\d+ 1;
    ~*^/collection/\d+ 1;
    ~*^/user-home 1;
}

server {
    listen 443 ssl;
    server_name www.moegen.ai;

    root /data/wwwroot/www.moegen.ai;
    index index.html;

    # ---- SEO: 爬虫访问详情页 → 转发到 SEO 渲染服务 ----
    location / {
        # 先检查预渲染的静态HTML（首页、分类页）
        # 例如 /ja/ /ja/novel 等已有预渲染目录
        try_files $uri $uri/index.html @spa;

        # 爬虫 + 详情页 → SEO渲染服务
        if ($is_bot) {
            rewrite ^(.*)$ /seo-render last;
        }
    }

    # SEO渲染入口：转发给Node服务
    location /seo-render {
        internal;
        proxy_pass http://127.0.0.1:3001/render?url=https://$host$uri;
        proxy_set_header Host $host;
        proxy_read_timeout 20s;

        # 渲染失败时降级返回SPA
        proxy_intercept_errors on;
        error_page 502 503 504 /index.html;
    }

    # SPA fallback
    location @spa {
        try_files $uri /index.html;
    }

    # ---- 静态资源 ----
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
