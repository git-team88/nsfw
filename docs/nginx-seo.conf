# ============================================
# Nginx SEO 配置 - 全站爬虫动态渲染方案
# 将此配置合并到目标站点的 server 块中
#
# 方案：所有路径只要判定为爬虫 UA，就转发到 SEO 渲染服务（seo-server.mjs）。
# 首页/分类页不再依赖构建时预渲染静态 HTML。
# ============================================

# ---- 放在 http 块（如 nginx.conf 的 http{} 内），全局只需一份 ----
map $http_user_agent $is_bot {
    default 0;
    ~*googlebot 1;
    ~*bingbot 1;
    ~*baiduspider 1;
    ~*yandexbot 1;
    ~*duckduckbot 1;
    ~*slurp 1;
    ~*facebot 1;
    ~*ia_archiver 1;
    ~*mediapartners 1;
    ~*adsbot-google 1;
    ~*ahrefsbot 1;
    ~*semrushbot 1;
    ~*chatgpt-user 1;
}

server {
    listen 443 ssl;
    server_name www.moegen.ai;

    root /data/wwwroot/www.moegen.ai;
    index index.html;

    # ★★ 爬虫判定必须放在「移动端 UA 跳转」之前 ★★
    # 否则 Googlebot-Smartphone（UA 含 Android/Mobile）会先被移动跳转拦截，抓不到 PC 渲染结果。
    # 全站所有路径：是爬虫 → 转发到 SEO 渲染服务（含首页/分类页/详情页）
    if ($is_bot) {
        rewrite ^(.*)$ /seo-render last;
    }

    # ……（若本站原有移动端 UA 301 跳转规则，放在此处，即爬虫判定之后）……

    # 普通用户：SPA
    location / {
        try_files $uri /index.html;
    }

    # SEO 渲染入口：转发给 Node 服务（seo-server.mjs，默认 3001）
    # 用 $request_uri（不受上面 rewrite 改写 $uri 的影响）+ 请求头传递目标 URL，
    # 避免详情页 query（?id=&contentType=）被渲染服务自身的 query 解析截断。
    location /seo-render {
        internal;
        proxy_set_header X-Render-Url https://$host$request_uri;
        proxy_pass http://127.0.0.1:3001/render;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;

        # 渲染服务异常时降级返回 SPA
        proxy_intercept_errors on;
        error_page 502 503 504 /index.html;
    }

    # ---- 静态资源 ----
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
